services:
  - type: web
    name: mehair-coach
    runtime: python
    branch: main
    region: oregon
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync python -m app.main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: UV_VERSION
        value: 0.10.8
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        sync: false
      - key: LIBSQL_AUTH_TOKEN
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
