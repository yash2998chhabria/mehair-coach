services:
  - type: web
    name: mehair-coach
    runtime: python
    branch: main
    region: oregon
    plan: starter
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync python -m app.main
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: mehair-coach-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: UV_VERSION
        value: 0.10.8
      - key: DATABASE_URL
        value: sqlite:////var/data/mehair-coach.sqlite3
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
