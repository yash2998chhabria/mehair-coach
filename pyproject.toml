[project]
name = "mehair-coach"
version = "0.1.0"
description = "Private-beta ChatGPT App for Google Health / Fitbit coaching"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45.0.0",
  "fastapi>=0.124.0",
  "httpx>=0.28.0",
  "mcp>=1.24.0",
  "pydantic-settings>=2.12.0",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.2.0",
  "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
